name: Audit

permissions:
  contents: read

on:
  push:
    tags:
      - "v*-recitation"
  schedule:
    - cron: "0 0 * * 2,6" # Every Tuesday and Saturday at 09:00 JST
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: "npm"
      - run: npm install -g npm@latest
      - run: npm version
      - name: Audit current revision
        run: |
          npm ci --dry-run --prefer-online
          npm audit --audit-level critical
      - name: Audit latest recitation release
        run: |
          set -euo pipefail
          release_tag=$(git tag --list 'v*-recitation' --sort=-version:refname | sed -n '1p')
          if [[ -z "$release_tag" ]]; then
            echo "::error::No recitation release tag found"
            exit 1
          fi
          echo "Auditing $release_tag"
          git checkout --detach "refs/tags/$release_tag"
          npm ci --dry-run --prefer-online
          npm audit --audit-level critical
